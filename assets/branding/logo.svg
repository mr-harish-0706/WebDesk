<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Icon Core Gradient -->
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Glass Overlay Gradient -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Glassmorphism Card Element -->
  <rect x="64" y="64" width="384" height="384" rx="80" fill="url(#glass)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Central WebDesk Icon Mark -->
  <g filter="url(#glow)" transform="translate(128, 128)">
    <!-- Outer Shield / Window Frame -->
    <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#icon-grad)" />

    <!-- Inner Grid / Globe Symbol -->
    <path d="M 64 64 H 192 V 192 H 64 Z" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 64 128 H 192" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
    <path d="M 128 64 V 192" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
    <circle cx="128" cy="128" r="32" fill="none" stroke="#ffffff" stroke-width="10" />
  </g>

  <!-- Sparkle Highlights -->
  <circle cx="384" cy="128" r="8" fill="#60a5fa" />
  <circle cx="128" cy="384" r="6" fill="#a78bfa" />
</svg>
